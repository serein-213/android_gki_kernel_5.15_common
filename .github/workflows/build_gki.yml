name: Build GKI Kernel

on:
  push:
    branches:
      - copilot/create-workflow-script-for-kernel
  pull_request:
    branches:
      - copilot/create-workflow-script-for-kernel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        path: android_gki_kernel_5.15_common

    - name: Free Disk Space
      run: |
        echo "Freeing up disk space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Install Dependencies
      run: |
        echo "Installing build dependencies..."
        sudo apt-get update
        sudo apt-get install -y git zip unzip curl wget python3 bc rsync schedtool \
          cpio ncurses-dev libxml2-utils inetutils-ping build-essential python3-pip \
          flex bison libssl-dev libelf-dev python3-venv lm-sensors

        # Install mkbootimg from AOSP source
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg
        cd mkbootimg
        sudo install -m 0755 mkbootimg.py /usr/local/bin/mkbootimg
        cd ..

        # Install Repo tool
        mkdir -p ~/.bin
        REPO_URL="https://storage.googleapis.com/git-repo-downloads/repo"
        curl -o ~/.bin/repo "$REPO_URL"
        chmod a+rx ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH

    - name: Run Build Script
      run: |
        cd android_gki_kernel_5.15_common
        chmod +x build_gki.sh
        # 运行构建脚本，它会自动处理环境设置、配置修复、构建和打包
        ./build_gki.sh

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GKI-Kernel-5.15
        path: |
          android_gki_kernel_5.15_common/out/*
        retention-days: 30
